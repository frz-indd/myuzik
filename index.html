<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>untitled</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline>
        <source src="assets/bg/rec.mp4" type="video/mp4">
        <source src="assets/bg/rec.webm" type="video/webm">
    </video>
    
    <audio id="audioPlayer">
        <source src="assets/bg/audio.mp3" type="audio/mpeg">
        <source src="assets/bg/audio.wav" type="audio/wav">
    </audio>
    
    <div class="content-overlay">
        <div class="album-section">
            <div class="album-art"></div>
        </div>
        <div class="song-info">
            <h2 class="song-title">whats up</h2>
            <p class="artist-name">Artist Name</p>
        </div>
        <div class="lyrics-section">
            <div class="lyric-container" id="lyricContainer"></div>
        </div>
        <div class="music-controls">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="player-buttons">
                <button class="btn-icon">♡</button>
                <button class="btn-icon" onclick="togglePlay()">▶</button>
                <button class="btn-icon">↻</button>
            </div>
            <div class="bottom-buttons">
                <button onclick="resetLyrics()">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
